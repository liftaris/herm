name: ci

on:
  pull_request:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: install contract-test capabilities
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends chafa ffmpeg
      - run: bun install --frozen-lockfile
      - name: check generated Hermes contracts
        run: |
          root="${RUNNER_TEMP}/hermes-agent-contracts"
          mapfile -t contract < <(bun -e 'const c = await Bun.file("hermes.contract.json").json(); console.log(c.repository); console.log(c.pinned)')
          repo="${contract[0]}"
          pin="${contract[1]}"
          git init -q "${root}"
          git -C "${root}" remote add origin "${repo}"
          git -C "${root}" fetch --depth=1 origin "${pin}"
          git -C "${root}" checkout --detach FETCH_HEAD
          HERMES_AGENT_ROOT="${root}" bun run gen-schema:check
          HERMES_AGENT_ROOT="${root}" bun run gen-hermes-manifest:check
          HERMES_AGENT_ROOT="${root}" bun run gen-fixtures:check
      - run: bun run test:check:strict
      - run: bunx tsc --noEmit
      - run: bun test
      - name: randomized order
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          seed="$(date -u +%Y%m%d)"
          echo "Replay command: bun test --randomize --seed=${seed}"
          bun test --randomize --seed="${seed}"
      - run: bun run build
