name: release

on:
  push:
    branches: [main, dev]

permissions:
  contents: write       # push tags + release commit
  issues: write         # semantic-release comments on released issues
  pull-requests: write
  id-token: write       # npm --provenance

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Don't recurse on the release commit the @semantic-release/git
    # plugin pushes back. `[skip ci]` in its message also gates this at
    # the Actions layer, but belt-and-suspenders for forks that strip it.
    if: "!contains(github.event.head_commit.message, 'chore(release):')"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0         # semantic-release needs full history + tags

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      # semantic-release itself and @semantic-release/npm run `npm`, not
      # bun, so a node toolchain still has to be present. setup-bun ships
      # node, but registry auth for provenance wants setup-node's writer.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile

      - name: install contract-test capabilities
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends chafa ffmpeg

      - name: check generated Hermes contracts
        run: |
          root="${RUNNER_TEMP}/hermes-agent-contracts"
          mapfile -t contract < <(bun -e 'const c = await Bun.file("hermes.contract.json").json(); console.log(c.repository); console.log(c.pinned)')
          repo="${contract[0]}"
          pin="${contract[1]}"
          git init -q "${root}"
          git -C "${root}" remote add origin "${repo}"
          git -C "${root}" fetch --depth=1 origin "${pin}"
          git -C "${root}" checkout --detach FETCH_HEAD
          HERMES_AGENT_ROOT="${root}" bun run gen-schema:check
          HERMES_AGENT_ROOT="${root}" bun run gen-hermes-manifest:check
          HERMES_AGENT_ROOT="${root}" bun run gen-fixtures:check

      - run: bun run test:check:strict

      - run: bunx tsc --noEmit

      - run: bun test

      - run: bun scripts/build.ts

      - name: semantic-release
        id: release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  backmerge:
    needs: release
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: dev
      - run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-ff --no-edit origin/main -m "chore: back-merge main after release [skip ci]"
          git push origin dev
